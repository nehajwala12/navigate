<style>
:root{--ink:#16211F;--cream:#F4EFE6;--gold:#A98543;--gpale:#E9C583;--claret:#5C2B2E;
  --hair:rgba(22,33,31,.14);--soft:rgba(22,33,31,.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.confbar{background:var(--ink);color:var(--cream);border-top:5px solid var(--gold);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.34em;
  text-transform:uppercase;text-align:center;padding:9px 12px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:transparent;border:1px solid var(--hair);border-radius:4px;padding:44px 40px;max-width:420px;width:100%}
.wordmark{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:24px;letter-spacing:-.3px;margin-bottom:4px}
.wordmark .mk{vertical-align:-3px;margin-right:9px}
.wordmark span.d{color:var(--gold)}
.sub{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--soft);
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:30px}
label{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
input{width:100%;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;
  color:var(--ink);background:transparent;border:1px solid rgba(22,33,31,.30);border-radius:4px;outline:none}
input:focus{border-color:var(--gold)}
button{margin-top:16px;width:100%;padding:12px;background:var(--ink);color:var(--cream);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;border:1px solid var(--ink);border-radius:4px;cursor:pointer;transition:140ms ease-out}
button:hover{background:var(--cream);color:var(--ink)}
#err{display:none;margin-top:14px;font-size:12.5px;color:var(--claret)}
.foot{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:1px;
  color:var(--soft);text-align:center;padding:16px;text-transform:uppercase}
</style>

function b64ToBytes(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function gunzip(bytes){
  if(typeof DecompressionStream!=="undefined"){
    const ds=new DecompressionStream("gzip");
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error("This browser does not support DecompressionStream; please use a current Chrome, Edge, Firefox or Safari.");
}
async function unlock(){
  const pw=document.getElementById("pw").value;
  const err=document.getElementById("err");
  err.style.display="none";
  try{
    const raw=b64ToBytes(PAYLOAD);
    const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const gz=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct));
    const html=new TextDecoder().decode(await gunzip(gz));
    document.open();document.write(html);document.close();
  }catch(e){
    err.textContent=(e&&e.message&&e.message.indexOf("DecompressionStream")>-1)?e.message:"Incorrect password.";
    err.style.display="block";
  }
}
document.getElementById("go").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
